# Sprint 3C — Firestore security-rules emulator gate.
# Runs the REAL rules against the Firestore Emulator on every push/PR.
# Requires JDK 21+ (firebase-tools requirement); GitHub runners provide it
# via setup-java. Locally: install JDK 21, then `npm run test:rules`.
name: Firestore Rules Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --prefix app --no-audit --no-fund
      - name: Type check current application
        run: npm --prefix app run check
      - name: Run source regression tests
        run: npm --prefix app test -- src --maxWorkers=1
      - name: Install Functions dependencies
        run: npm ci --prefix app/functions --no-audit --no-fund
      - name: Validate Functions syntax and regressions
        run: |
          npm --prefix app/functions run check
          node --test app/functions/productionReadiness.functions.node-test.cjs app/functions/privacyCompatibility.node-test.cjs app/functions/accountDeletion.node-test.cjs app/functions/discoveryGateway.node-test.cjs app/functions/accountJobs.node-test.cjs
      - name: Run Firestore rules emulator tests
        run: npm run test:rules
      - name: Run Storage rules emulator tests
        run: npm run test:storage-rules
      - name: Build current application
        run: npm --prefix app run build
      - name: Install isolated workflow test tools
        run: |
          npm ci --no-audit --no-fund
          npm install --global firebase-tools@15.15.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run independent-user workflow and browser acceptance
        run: node scripts/run-workflow-emulators.cjs
      - name: Lint current application
        run: npm --prefix app run lint
